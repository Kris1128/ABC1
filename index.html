<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字母馆 · 26个英文字母</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23A9CEBF' stroke='%231B2A2B' stroke-width='4'/><text x='32' y='45' font-family='Georgia,serif' font-size='34' font-weight='700' text-anchor='middle' fill='%231B2A2B'>Aa</text></svg>">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Baloo+2:wght@600;800&family=Noto+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ===== 设计变量 ===== */
:root{
  --paper:#EDF1EA;
  --sheet:#FBFCF6;
  --ink:#1B2A2B;
  --ink-2:#4F615B;
  --ink-3:#7B8B85;
  --mint:#A9CEBF;
  --butter:#EBCF8B;
  --blush:#EBA79B;
  --lilac:#C3B4D6;
  --accent:#B8462F;
  --en:'Baloo 2','Noto Sans',system-ui,sans-serif;
  --ipa:'Noto Sans','DejaVu Sans',system-ui,sans-serif;
  --zh:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--zh);
  font-size:16px;
  line-height:1.65;
  padding-bottom:48px;
  background-image:radial-gradient(circle at 1px 1px, rgba(27,42,43,.055) 1px, transparent 0);
  background-size:6px 6px;
}
img{max-width:100%}
button{font-family:inherit;color:inherit}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 18px}

/* ===== 顶栏 ===== */
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1.5px solid var(--ink)}
.bar-in{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-family:var(--zh);font-size:19px;font-weight:700;letter-spacing:.02em}
.brand em{font-family:var(--en);font-style:normal;font-size:12px;color:var(--ink-3);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:10px;flex-shrink:0}
.meter .num{font-family:var(--en);font-weight:600;font-size:14px;letter-spacing:.02em;white-space:nowrap}
.meter .num s{text-decoration:none;color:var(--ink-3)}
.dots{display:none}
.pbar{display:none;width:96px;height:8px;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden;background:var(--sheet);flex-shrink:0}
.pbar span{display:block;height:100%;width:0;background:var(--ink);transition:width .25s ease}
@media(min-width:600px){.pbar{display:block}}
.reset{background:none;border:1.5px solid var(--ink);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.reset:hover{background:var(--ink);color:var(--sheet)}

/* ===== 首页 ===== */
.hero{padding:30px 0 32px;border-bottom:1.5px solid var(--ink)}
@media(min-width:880px){
  .hero{display:grid;grid-template-columns:1.02fr .98fr;gap:44px;align-items:end;padding:54px 0 46px}
}
.kicker{font-size:13px;color:var(--ink-2);letter-spacing:.04em;margin-bottom:14px}
.kicker span{display:inline-block;border-bottom:2px solid var(--accent);padding-bottom:2px}
h1{font-size:clamp(33px,8.6vw,70px);line-height:1.08;letter-spacing:-.015em;font-weight:700}
h1 .en{font-family:var(--en);font-weight:800;letter-spacing:.01em}
.lede{margin-top:16px;color:var(--ink-2);font-size:15px;max-width:32em}
.lede b{color:var(--ink);font-weight:500}

.board-wrap{margin-top:26px}
@media(min-width:880px){.board-wrap{margin-top:0}}
.board{background:var(--ink);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px;box-shadow:7px 7px 0 rgba(27,42,43,.16)}
.cell{position:relative;aspect-ratio:.84/1;background:var(--sheet);border-radius:5px;display:grid;place-items:center;overflow:hidden;perspective:700px}
.cell::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:1px;background:rgba(27,42,43,.18)}
.cell b{display:block;font-family:var(--en);font-weight:800;font-size:clamp(17px,4.6vw,38px);line-height:1;transition:transform .16s ease,opacity .16s ease;transform-origin:50% 50%}
.cell b.out{transform:rotateX(-88deg);opacity:.25}
.board-cap{margin-top:10px;font-size:12.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px}
.board-cap em{font-style:normal;font-family:var(--ipa);letter-spacing:.04em}

/* ===== 网格 ===== */
.grid-sec{padding:26px 0 6px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-title{font-size:15px;font-weight:500;color:var(--ink)}
.sec-title s{text-decoration:none;color:var(--ink-3);font-size:13px;font-weight:400;margin-left:8px}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.legend i{width:12px;height:12px;border:1.5px solid var(--ink);border-radius:3px;display:inline-block;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
@media(min-width:720px){.grid{grid-template-columns:repeat(7,minmax(0,1fr));gap:13px}}
.tile{
  position:relative;border:2px solid var(--ink);border-radius:9px;background:var(--c,var(--sheet));
  aspect-ratio:1/1.07;padding:8px 8px 9px;display:flex;flex-direction:column;justify-content:flex-end;
  cursor:pointer;text-align:left;box-shadow:4px 4px 0 var(--ink);align-items:stretch;
  transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;
}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.t-idx{position:absolute;top:8px;left:9px;font-family:var(--ipa);font-size:10.5px;letter-spacing:.14em;color:rgba(27,42,43,.62)}
.t-case{flex:1;display:flex;align-items:center;gap:2px;justify-content:center;width:100%;min-width:0}
.t-case .up{font-family:var(--en);font-weight:800;font-size:clamp(24px,5.2vw,48px);line-height:.94}
.t-case .low{font-family:var(--en);font-weight:600;font-size:clamp(16px,3.4vw,30px);line-height:1;opacity:.72}
.t-ipa{display:block;font-family:var(--ipa);font-size:clamp(10px,2.3vw,12.5px);color:rgba(27,42,43,.72);text-align:center;letter-spacing:.03em;width:100%;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.t-done{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;opacity:0;transform:scale(.7);transition:.16s}
.t-done.on{opacity:1;transform:scale(1)}
.t-done svg{width:9px;height:9px;stroke:var(--sheet);stroke-width:3;fill:none}
.tile.util{background:var(--sheet);border-style:dashed;box-shadow:4px 4px 0 rgba(27,42,43,.3);justify-content:center;align-items:center;gap:8px}
.tile.util:hover{background:var(--ink);color:var(--sheet)}
.tile.util:hover .u-ic{border-color:var(--sheet)}
.u-ic{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;color:var(--ink)}
.u-ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.u-label{font-size:12.5px;text-align:center;line-height:1.3}
.tile.playing{outline:4px solid var(--accent);outline-offset:-4px}

/* ===== 详情视图 ===== */
#detail{display:none}
body[data-view="detail"] #home{display:none}
body[data-view="detail"] #detail{display:block}
.d-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 0;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:7px;background:none;border:1.5px solid var(--ink);border-radius:22px;padding:6px 14px 6px 11px;font-size:13px;cursor:pointer}
.back:hover{background:var(--ink);color:var(--sheet)}
.back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.pager{display:flex;align-items:center;gap:8px}
.pg{border:1.5px solid var(--ink);background:var(--sheet);border-radius:8px;height:34px;min-width:34px;padding:0 10px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
.pg:hover{background:var(--ink);color:var(--sheet)}
.pg:disabled{opacity:.32;cursor:not-allowed;box-shadow:none;background:var(--paper)}
.pg b{font-family:var(--en);font-size:15px}

.plate{margin-top:18px;border:2px solid var(--ink);border-radius:12px;background:var(--sheet);box-shadow:7px 7px 0 var(--ink);overflow:hidden;display:grid}
@media(min-width:820px){.plate{grid-template-columns:1.06fr .94fr}}
.plate-l{padding:22px 20px 18px;background:var(--tint,var(--mint));border-bottom:2px solid var(--ink);position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:space-between}
@media(min-width:820px){.plate-l{border-bottom:none;border-right:2px solid var(--ink);padding:26px 26px 22px}}
.plate-l .meta{font-family:var(--ipa);font-size:11.5px;letter-spacing:.16em;color:rgba(27,42,43,.66)}
.glyphs{display:flex;align-items:flex-end;gap:14px;margin-top:auto}
.glyphs .up{font-family:var(--en);font-weight:800;font-size:clamp(96px,24vw,186px);line-height:.8}
.glyphs .low{font-family:var(--en);font-weight:600;font-size:clamp(62px,15vw,120px);line-height:.8;opacity:.72}
.plate-l .cn{font-size:13px;color:rgba(27,42,43,.72);margin-top:12px}
.plate-r{padding:20px 20px 22px;display:flex;flex-direction:column;gap:0}
@media(min-width:820px){.plate-r{padding:24px 26px}}
.fact{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px dashed rgba(27,42,43,.22)}
.fact:last-of-type{border-bottom:none}
.f-key{flex:0 0 64px;font-size:12px;color:var(--ink-2);padding-top:3px}
.f-val{flex:1;min-width:0;font-size:14px;line-height:1.6}
.f-ipa{font-family:var(--ipa);font-size:20px;line-height:1.3;letter-spacing:.02em}
.f-ipa s{text-decoration:none;font-size:13px;color:var(--ink-3);margin-left:8px}
.say{border:1.5px solid var(--ink);background:var(--sheet);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex-shrink:0;box-shadow:2px 2px 0 var(--ink)}
.say{color:var(--ink)}
.say svg{width:15px;height:15px;fill:currentColor}
.say:hover{background:var(--ink);color:var(--sheet)}
.say:active{transform:translate(2px,2px);box-shadow:none}

/* 书写 / 描红 */
.sect{margin-top:30px}
.sect-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sect-h h2{font-size:17px;font-weight:700;letter-spacing:.01em}
.sect-h .hint{font-size:12.5px;color:var(--ink-3)}
.trace-box{border:2px solid var(--ink);border-radius:12px;background:var(--sheet);box-shadow:5px 5px 0 var(--ink);padding:12px}
.cv-stack{position:relative;width:100%;aspect-ratio:2.6/1;border-radius:6px;overflow:hidden;background:#FFFEF9}
.cv-stack canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
#ghostCv{cursor:default}
#inkCv{cursor:crosshair}
.f-note{font-size:12px;color:var(--ink-3);margin-left:6px;font-weight:400}
.trace-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.trace-bar .left{display:flex;gap:8px;flex-wrap:wrap}
.mini{border:1.5px solid var(--ink);background:var(--sheet);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.mini:hover{background:var(--ink);color:var(--sheet)}
.mini:active{transform:translate(2px,2px);box-shadow:none}
.mini.on{background:var(--ink);color:var(--sheet)}
.prog{font-family:var(--ipa);font-size:13px;color:var(--ink-2);white-space:nowrap}
.prog b{font-family:var(--en);font-size:16px}

/* 单词 */
.words{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.words{grid-template-columns:repeat(3,1fr);gap:12px}}
.wcard{border:2px solid var(--ink);border-radius:10px;background:var(--sheet);box-shadow:4px 4px 0 var(--ink);padding:14px 15px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.wcard .w-top{font-family:var(--en);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:.01em;word-break:break-word}
.wcard .w-ipa{font-family:var(--ipa);font-size:13px;color:var(--ink-2);margin-top:3px}
.wcard .w-zh{font-size:13px;color:var(--ink);margin-top:6px}
.wcard .say{width:30px;height:30px;margin-top:2px}

/* 小测验 */
.quiz{border:2px solid var(--ink);border-radius:12px;background:var(--sheet);box-shadow:5px 5px 0 var(--ink);padding:16px 16px 18px}
.q-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.q-txt{font-size:15px;font-weight:500}
.q-txt b{font-family:var(--en);font-size:18px}
.q-score{font-family:var(--ipa);font-size:12.5px;color:var(--ink-3)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.opt{border:2px solid var(--ink);background:var(--sheet);border-radius:9px;padding:11px 6px;cursor:pointer;font-family:var(--en);font-weight:600;font-size:17px;letter-spacing:.02em;box-shadow:3px 3px 0 var(--ink);transition:.12s}
.opt:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt:active{transform:translate(2px,2px);box-shadow:none}
.opt.ok{background:var(--mint);border-color:var(--ink)}
.opt.no{background:repeating-linear-gradient(45deg,#F3D6CF,#F3D6CF 6px,#EFC8BF 6px,#EFC8BF 12px)}
.opt[disabled]{cursor:default;transform:none;box-shadow:2px 2px 0 var(--ink)}
.q-feed{margin-top:11px;font-size:13px;min-height:22px;color:var(--ink-2)}

/* 底部导航 */
.d-foot{margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:16px;border-top:1.5px solid var(--ink)}
.learn-btn{border:2px solid var(--ink);background:var(--sheet);border-radius:22px;padding:8px 18px;font-size:13.5px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:inline-flex;align-items:center;gap:7px}
.learn-btn.on{background:var(--ink);color:var(--sheet)}
.learn-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:var(--sheet);font-size:13.5px;padding:9px 16px;border-radius:22px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:82vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body data-view="home">

<header class="bar">
  <div class="bar-in">
    <div class="brand"><b>字母馆</b><em>Alphabet Museum</em></div>
    <div class="meter">
      <div class="pbar" aria-hidden="true"><span id="barFill"></span></div>
      <span class="num">已学会 <b id="doneNum">0</b><s>/26</s></span>
      <button class="reset" id="resetBtn" type="button">重置</button>
    </div>
  </div>
</header>

<main id="home">
  <div class="wrap">
    <section class="hero">
      <div class="hero-l">
        <div class="kicker"><span>26 个字母,26 扇小门</span></div>
        <h1>从 <span class="en">Aa</span> 到 <span class="en">Zz</span>,<br>一个一个学。</h1>
        <p class="lede">点开任意一张字母卡:看清它的<b>大写和小写</b>,听<b>字母名和音标</b>,跟着四线三格<b>描一遍</b>,再记三个常用单词。</p>
      </div>
      <div class="board-wrap" aria-hidden="true">
        <div class="board" id="board">
          <div class="cell"><b>A</b></div>
          <div class="cell"><b>P</b></div>
          <div class="cell"><b>P</b></div>
          <div class="cell"><b>L</b></div>
          <div class="cell"><b>E</b></div>
        </div>
        <div class="board-cap"><span>字母拼成单词</span><span>点卡片开始</span></div>
      </div>
    </section>

    <section class="grid-sec">
      <div class="sec-head">
        <div class="sec-title">字母卡片<s>点一下,进去看</s></div>
        <div class="legend"><span>四组颜色</span><i style="background:var(--mint)"></i><i style="background:var(--butter)"></i><i style="background:var(--blush)"></i><i style="background:var(--lilac)"></i></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="sect" style="margin-bottom:34px">
      <p style="font-size:13px;color:var(--ink-3);max-width:44em">音标采用英式注音,个别字母在美式读法不同处会另行标出。看到喇叭按钮就点一下,可以听发音。</p>
    </section>
  </div>
</main>

<div id="detail"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 字母数据 ===== */
const LETTERS = [
{l:'A',n:'/eɪ/',s:'/æ/',tip:'字母名读“诶”。在单词里 A 最常读 /æ/,嘴巴张大、下巴放下来,像“啊”的短促版。',mn:'大写 A 像一把立起来的梯子,小写 a 像一个圆肚子带小尾巴。',w:[['apple','/ˈæpl/','苹果'],['ant','/ænt/','蚂蚁'],['arm','/ɑːm/','手臂']]},
{l:'B',n:'/biː/',s:'/b/',tip:'字母名读“比”。/b/ 是双唇先闭紧再弹开,轻轻一声“波”,不要拖出“呃”。',mn:'大写 B 像两个叠在一起的鼓包,小写 b 像一棵刚冒头的小芽。',w:[['ball','/bɔːl/','球'],['bear','/beə(r)/','熊'],['bus','/bʌs/','公交车']]},
{l:'C',n:'/siː/',s:'/k/',tip:'字母名读“西”。单词里 C 常读 /k/,舌根轻轻一顶,气一下出来,不送气。',mn:'大写 C 像一张张开的嘴,小写 c 就是它的小号。',w:[['cat','/kæt/','猫'],['cake','/keɪk/','蛋糕'],['car','/kɑː(r)/','小汽车']]},
{l:'D',n:'/diː/',s:'/d/',tip:'字母名读“低”。/d/ 舌尖顶住上牙床再放下,像轻轻敲一下门。',mn:'大写 D 像一张拉满的弓,小写 d 像一把小勺子。',w:[['dog','/dɒɡ/','狗'],['duck','/dʌk/','鸭子'],['door','/dɔː(r)/','门']]},
{l:'E',n:'/iː/',s:'/e/',tip:'字母名读“衣”。单词里的短音 /e/ 比名字短,像“诶”往下压一点、收住。',mn:'大写 E 像一把梳子,小写 e 像一个卷起来的小圈。',w:[['egg','/eɡ/','鸡蛋'],['elephant','/ˈelɪfənt/','大象'],['eye','/aɪ/','眼睛']]},

/* ===== 学习进度 ===== */
const STORE_KEY = 'alphabet-learned-v1';
let learned = new Set();
try{
  const raw = localStorage.getItem(STORE_KEY);
  if(raw) JSON.parse(raw).forEach(x => learned.add(x));
}catch(e){}

function saveLearned(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify([...learned])); }catch(e){}
}
function updateMeter(){
  document.getElementById('doneNum').textContent = learned.size;
  document.getElementById('barFill').style.width = (learned.size / 26 * 100) + '%';
  document.querySelectorAll('[data-done]').forEach(b => b.classList.toggle('on', learned.has(b.dataset.done)));
}

/* ===== 提示条 ===== */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ===== 朗读 ===== */
let voices = [];
function refreshVoices(){
  try{ voices = window.speechSynthesis ? (speechSynthesis.getVoices() || []) : []; }catch(e){ voices = []; }
}
refreshVoices();
if(window.speechSynthesis) speechSynthesis.onvoiceschanged = refreshVoices;

function speak(text, rate){
  if(!window.speechSynthesis){ toast('这个浏览器不支持朗读,换 Chrome 试试'); return; }
  refreshVoices();
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate || 0.9;
    u.pitch = 1.03;
    const v = voices.find(v => /en[-_](US|GB)/i.test(v.lang) && /Samantha|Zira|Aria|Google US English|Female/i.test(v.name))
      || voices.find(v => /^en/i.test(v.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){ toast('朗读没成功,再点一次试试'); }
}

/* ===== 顶部翻牌 ===== */
const BOARD_WORDS = ['APPLE','BREAD','CLOCK','EAGLE','FLAME','GRAPE','HOUSE','IGLOO','JUICE','LEMON','MOUSE','NIGHT','PEACH','QUEEN','ROBIN','SNAKE','TIGER'];
const boardCells = [...document.querySelectorAll('#board .cell b')];
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function flipTo(word){
  boardCells.forEach((cell, i) => {
    const ch = word[i] || ' ';
    if(reduced){ cell.textContent = ch; return; }
    setTimeout(() => {
      cell.classList.add('out');
      setTimeout(() => { cell.textContent = ch; cell.classList.remove('out'); }, 160);
    }, i * 80);
  });
}
let wordIdx = 0;
if(!reduced){
  setInterval(() => {
    if(document.body.dataset.view !== 'home') return;
    wordIdx = (wordIdx + 1) % BOARD_WORDS.length;
    flipTo(BOARD_WORDS[wordIdx]);
  }, 2800);
}

/* ===== 字母歌 ===== */
let songTimer = null, songIdx = -1;
function stopSong(quiet){
  clearTimeout(songTimer);
  songIdx = -1;
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll('.tile.playing').forEach(t => t.classList.remove('playing'));
  if(!quiet) toast('已经停下');
}
function playSong(){
  if(songIdx >= 0){ stopSong(); return; }
  songIdx = 0;
  const step = () => {
    if(songIdx < 0) return;
    if(songIdx >= LETTERS.length){
      songIdx = -1;
      document.querySelectorAll('.tile.playing').forEach(t => t.classList.remove('playing'));
      toast('A 到 Z 唱完了');
      return;
    }
    const tile = grid.querySelector(`[data-i="${songIdx}"]`);
    document.querySelectorAll('.tile.playing').forEach(t => t.classList.remove('playing'));
    if(tile){
      tile.classList.add('playing');
      if(!tile.dataset.done) { /* 只做高亮,不改进度 */ }
    }
    speak(LETTERS[songIdx].l, 0.85);
    songIdx++;
    songTimer = setTimeout(step, 950);
  };
  step();
}

/* ===== 路由 ===== */
const detailEl = document.getElementById('detail');
function goLetter(i, push){
  if(i < 0 || i >= LETTERS.length) return;
  const hash = '#/letter/' + LETTERS[i].l;
  if(push === false) return;
  if(location.hash === hash) route(); else location.hash = hash;
}
function goHome(){
  if(location.hash === '#/' || location.hash === ''){ route(); }
  else location.hash = '#/';
}
function route(){
  const m = location.hash.match(/^#\/letter\/([A-Za-z])$/);
  if(m){
    const i = LETTERS.findIndex(d => d.l === m[1].toUpperCase());
    if(i >= 0){
      document.body.dataset.view = 'detail';
      renderDetail(i);
      window.scrollTo(0, 0);
      return;
    }
  }
  document.body.dataset.view = 'home';
  detailEl.innerHTML = '';
  if(songIdx >= 0) stopSong(true);
  if(window.speechSynthesis) speechSynthesis.cancel();
}
window.addEventListener('hashchange', route);

/* ===== 描红 ===== */
function setupTrace(d){
  const ghostCv = document.getElementById('ghostCv');
  const inkCv = document.getElementById('inkCv');
  const narrow = window.innerWidth < 620;
  const LW = narrow ? 480 : 1080;
  const LH = narrow ? 690 : 360;
  const stack = document.querySelector('.cv-stack');
  if(stack) stack.style.aspectRatio = narrow ? '0.696' : '3';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  [ghostCv, inkCv].forEach(cv => { cv.width = LW * dpr; cv.height = LH * dpr; });
  const gctx = ghostCv.getContext('2d');
  const ictx = inkCv.getContext('2d');
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ictx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cap = narrow ? 160 : 170;
  const xh = Math.round(cap / 2);
  const desc = Math.round(cap / 2);
  const pad = narrow ? 26 : 48;
  const bands = narrow ? [250, 570] : [250];
  const labels = narrow
    ? [{ t: '大写', x: 26, y: 68 }, { t: '小写', x: 26, y: 388 }]
    : [{ t: '大写', x: 56, y: 62 }, { t: '小写', x: LW / 2 + 26, y: 62 }];
  const hint = document.querySelector('.trace-bar .prog');
  if(hint) hint.textContent = narrow ? '大写写上面,小写写下面' : '大写写左边,小写写右边';

  function drawGrid(){
    gctx.clearRect(0, 0, LW, LH);
    gctx.fillStyle = '#FFFEF9';
    gctx.fillRect(0, 0, LW, LH);

    // 格内分区提示
    gctx.font = '500 20px "Noto Sans SC", "PingFang SC", system-ui, sans-serif';
    gctx.fillStyle = 'rgba(27,42,43,.42)';
    gctx.textAlign = 'left';
    gctx.textBaseline = 'alphabetic';
    labels.forEach(l => gctx.fillText(l.t, l.x, l.y));

    bands.forEach(base => {
      const ys = [base - cap, base - xh, base, base + desc];
      const styles = [
        { width: 1.6, color: 'rgba(27,42,43,.75)', dash: [] },
        { width: 1.2, color: 'rgba(27,42,43,.34)', dash: [9, 7] },
        { width: 2.2, color: '#B8462F', dash: [] },
        { width: 1.2, color: 'rgba(27,42,43,.34)', dash: [9, 7] }
      ];
      styles.forEach((st, i) => {
        gctx.beginPath();
        gctx.setLineDash(st.dash);
        gctx.moveTo(pad, ys[i]);
        gctx.lineTo(LW - pad, ys[i]);
        gctx.strokeStyle = st.color;
        gctx.lineWidth = st.width;
        gctx.stroke();
        gctx.setLineDash([]);
      });
    });

    // 宽屏时用一条竖虚线分出大写、小写两个区
    if(!narrow){
      gctx.beginPath();
      gctx.setLineDash([8, 8]);
      gctx.moveTo(LW / 2, 250 - cap - 20);
      gctx.lineTo(LW / 2, 250 + desc + 10);
      gctx.strokeStyle = 'rgba(27,42,43,.22)';
      gctx.lineWidth = 1.2;
      gctx.stroke();
      gctx.setLineDash([]);
    }
  }
  drawGrid();

  let drawing = false, lastPt = null;
  function toLocal(e){
    const r = inkCv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (LW / r.width), y: (e.clientY - r.top) * (LH / r.height) };
  }
  const width = narrow ? 16 : 14;
  function dot(p){
    ictx.beginPath();
    ictx.arc(p.x, p.y, width / 2, 0, Math.PI * 2);
    ictx.fillStyle = '#1B2A2B';
    ictx.fill();
  }
  inkCv.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    inkCv.setPointerCapture(e.pointerId);
    drawing = true;
    lastPt = toLocal(e);
    dot(lastPt);
  });
  inkCv.addEventListener('pointermove', e => {
    if(!drawing) return;
    e.preventDefault();
    const p = toLocal(e);
    ictx.beginPath();
    ictx.moveTo(lastPt.x, lastPt.y);
    ictx.lineTo(p.x, p.y);
    ictx.strokeStyle = '#1B2A2B';
    ictx.lineWidth = width;
    ictx.lineCap = 'round';
    ictx.lineJoin = 'round';
    ictx.stroke();
    lastPt = p;
  });
  const endDraw = () => { drawing = false; };
  inkCv.addEventListener('pointerup', endDraw);
  inkCv.addEventListener('pointercancel', endDraw);
  inkCv.addEventListener('pointerleave', endDraw);

  document.getElementById('clearCv').addEventListener('click', () => {
    ictx.clearRect(0, 0, LW, LH);
  });
}

/* ===== 小测验 ===== */
function setupQuiz(d){
  const box = document.getElementById('quiz');
  let round = 0, score = 0;
  const pool = LETTERS.filter(x => x.l !== d.l).map(x => x.w[0]);
  const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);

  function newRound(){
    const correct = d.w[round % d.w.length];
    const wrongPool = shuffle(pool.filter(w => w[0][0].toUpperCase() !== d.l)).slice(0, 3);
    const opts = shuffle([correct, ...wrongPool]);
    const ansIdx = opts.indexOf(correct);
    box.innerHTML = `
      <div class="q-line">
        <div class="q-txt">哪个单词以 <b>${d.l}</b> 开头?</div>
        <div class="q-score">第 ${round + 1} 题,答对 ${score}</div>
      </div>
      <div class="opts">
        ${opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${o[0]}</button>`).join('')}
      </div>
      <div class="q-feed" id="qFeed" aria-live="polite">选一个你觉得对的。</div>`;
    box.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = Number(btn.dataset.k);
        const feed = box.querySelector('#qFeed');
        box.querySelectorAll('.opt').forEach(o => { o.disabled = true; });
        if(k === ansIdx){
          btn.classList.add('ok');
          score++;
          feed.textContent = `对了,「${correct[0]}」就是以 ${d.l} 开头,意思是${correct[2]}。`;
          speak(correct[0], 0.88);
        }else{
          btn.classList.add('no');
          box.querySelectorAll('.opt')[ansIdx].classList.add('ok');
          feed.textContent = `「${opts[k][0]}」是以 ${opts[k][0][0].toUpperCase()} 开头的;${d.l} 开头的那个是「${correct[0]}」。`;
        }
        round++;
        const qScore = box.querySelector('.q-score');
        if(qScore) qScore.textContent = `第 ${round} 题 · 答对 ${score}`;
        setTimeout(() => {
          if(score >= 3){ box.innerHTML = `<div class="q-line"><div class="q-txt">连对三题,字母 ${d.l} 过关了。</div><div class="q-score">答对 ${score} 题</div></div><div class="q-feed">可以回到字母表,点下一张卡片。</div>`; return; }
          newRound();
        }, 1700);
      });
    });
  }
  newRound();
}

/* ===== 网格点击 ===== */
grid.addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if(!tile) return;
  if(tile.dataset.i !== undefined){
    goLetter(Number(tile.dataset.i));
    return;
  }
  const act = tile.dataset.act;
  if(act === 'random'){
    const left = LETTERS.filter(d => !learned.has(d.l));
    const pick = (left.length ? left : LETTERS)[Math.floor(Math.random() * (left.length ? left.length : LETTERS.length))];
    goLetter(LETTERS.indexOf(pick));
    toast(`抽到字母 ${pick.l}`);
  }else if(act === 'song'){
    playSong();
  }
});

/* ===== 重置进度(点两次确认) ===== */
const resetBtn = document.getElementById('resetBtn');
let resetArmed = false, resetTimer = null;
resetBtn.addEventListener('click', () => {
  if(!learned.size){ toast('还没有标记过任何字母'); return; }
  if(!resetArmed){
    resetArmed = true;
    resetBtn.textContent = '再点一次清空';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => {
      resetArmed = false;
      resetBtn.textContent = '重置';
    }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  resetArmed = false;
  resetBtn.textContent = '重置';
  learned.clear();
  saveLearned();
  updateMeter();
  toast('学习进度已清空,可以重新开始');
  const lb = document.getElementById('learnBtn');
  if(lb && document.body.dataset.view === 'detail'){
    lb.classList.remove('on');
    document.getElementById('learnTxt').textContent = '标记为学会';
  }
});

/* ===== 键盘 ===== */
document.addEventListener('keydown', e => {
  if(document.body.dataset.view !== 'detail') return;
  const m = location.hash.match(/^#\/letter\/([A-Za-z])$/);
  if(!m) return;
  const i = LETTERS.findIndex(d => d.l === m[1].toUpperCase());
  if(e.key === 'ArrowRight' && i < 25){ goLetter(i + 1); }
  if(e.key === 'ArrowLeft' && i > 0){ goLetter(i - 1); }
  if(e.key === 'Escape'){ location.hash = '#/'; }
});

route();
</script>
